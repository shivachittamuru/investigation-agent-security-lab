[project]
name = "investigation-agent-security-lab"
version = "0.1.0"
description = "A hands-on Python reference implementation for securing and evaluating AI agents through identity, authorization, prompt-injection testing, audit, and reliability controls."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "ipykernel>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigation_agent_security_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
